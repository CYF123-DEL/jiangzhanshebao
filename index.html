<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f2f5;color:#333;font-size:14px;line-height:1.6}
:root{--primary:#3b82f6;--primary-dark:#2563eb;--primary-light:#dbeafe;--bg:#f0f2f5;--card:#fff;--border:#e5e7eb;--text:#333;--text-light:#6b7280;--danger:#ef4444;--warning:#f59e0b;--success:#10b981;--shadow:0 1px 3px rgba(0,0,0,.1)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#e0e7ef 0%,#f0f2f5 100%)}
.login-card{background:#fff;border-radius:12px;padding:40px 32px;width:90%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.login-card h1{font-size:20px;color:#1e293b;margin-bottom:6px}
.login-card p{color:#6b7280;font-size:13px;margin-bottom:28px}
.login-card input{width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:14px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--primary)}
.login-card button{width:100%;padding:13px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.login-card button:hover{background:var(--primary-dark)}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:20px}
.main-wrap{display:none;min-height:100vh}
.top-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar h2{font-size:15px;color:#1e293b;font-weight:700}
.top-bar .subtitle{font-size:11px;color:var(--text-light);font-weight:400;margin-left:8px}
.top-bar .user-info{font-size:13px;color:var(--text-light)}
.top-bar .logout-btn{font-size:12px;color:var(--danger);cursor:pointer;margin-left:12px;border:1px solid var(--danger);padding:2px 10px;border-radius:4px;background:#fff}
.tab-bar{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;padding:0 8px}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:12px 16px;font-size:13px;color:var(--text-light);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-content{padding:16px;max-width:1200px;margin:0 auto}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat-card .num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:12px;color:var(--text-light);margin-top:4px}
.stat-card.red .num{color:var(--danger)}
.stat-card.green .num{color:var(--success)}
.stat-card.orange .num{color:var(--warning)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)}
th{background:#f8fafc;color:var(--text-light);font-weight:600;font-size:12px;white-space:nowrap}
td{color:var(--text)}
input[type=number],input[type=text],select{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;outline:none;width:100%;min-width:80px}
input:focus,select:focus{border-color:var(--primary)}
input[type=number]{text-align:right}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.chart-box{position:relative;width:100%;margin:16px 0}
.chart-box.tall{min-height:700px}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600}
.badge-ok{background:#d1fae5;color:#065f46}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-err{background:#fee2e2;color:#991b1b}
.layer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
.layer-card{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px}
.layer-card h4{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.layer-card .tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600}
.tag-gm{background:#dbeafe;color:#1e40af}
.tag-mgmt{background:#e0e7ff;color:#3730a3}
.tag-mid{background:#fef3c7;color:#92400e}
.tag-emp{background:#f3f4f6;color:#374151}
.scenario-card{background:#fff;border:2px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all .2s}
.scenario-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(59,130,246,.15)}
.scenario-card.recommended{border-color:var(--primary);background:#f0f7ff}
.scenario-card h4{font-size:14px;font-weight:600;margin-bottom:8px;color:#1e293b}
.scenario-card .cost{font-size:22px;font-weight:700;color:var(--primary)}
.scenario-card .detail{font-size:12px;color:var(--text-light);margin-top:6px}
.progress-bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.policy-card{background:linear-gradient(135deg,#f0f7ff 0%,#e8f0fe 100%);border:1px solid #bfdbfe;border-radius:10px;padding:20px;margin-bottom:16px}
.policy-card h3{color:#1e40af;border-bottom-color:#bfdbfe}
.policy-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
.policy-badge.national{background:#dbeafe;color:#1e40af}
.policy-badge.local{background:#fef3c7;color:#92400e}
.policy-badge.diff{background:#fee2e2;color:#991b1b}
.history-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.history-item:last-child{border-bottom:none}
.highlight-row{background:#f0f7ff!important}
.timeline{display:flex;gap:0;margin:20px 0;overflow-x:auto;padding-bottom:10px}
.timeline-item{flex:1;min-width:140px;text-align:center;position:relative;padding:0 8px}
.timeline-item::before{content:'';position:absolute;top:16px;left:0;right:0;height:3px;background:#e5e7eb;z-index:0}
.timeline-item:first-child::before{left:50%}
.timeline-item:last-child::before{right:50%}
.timeline-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:13px;font-weight:700;color:#fff;position:relative;z-index:1}
.timeline-dot.current{background:var(--primary);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
.timeline-dot.future{background:#94a3b8}
.timeline-dot.done{background:var(--success)}
.timeline-label{font-size:12px;font-weight:600;color:#1e293b;margin-bottom:2px}
.timeline-desc{font-size:11px;color:var(--text-light)}
.case-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px;transition:box-shadow .2s}
.case-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.case-card h4{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.case-card .case-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-light);margin-bottom:10px}
.case-card .case-body{font-size:13px;color:var(--text);line-height:1.8}
.case-card .case-result{background:#f0f7ff;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px}
.std-card{background:#fff;border-left:4px solid var(--primary);border-radius:0 10px 10px 0;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.std-card h4{font-size:14px;font-weight:600;color:#1e293b;margin-bottom:6px}
.std-card p{font-size:13px;color:var(--text);line-height:1.7}
.sub-tab-bar{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)}
.sub-tab-btn{padding:10px 18px;font-size:13px;color:var(--text-light);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-weight:500}
.sub-tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.sub-panel{display:none}.sub-panel.active{display:block}
.single-calc-result{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;padding:18px;margin-top:16px}
.single-calc-result h4{font-size:14px;font-weight:600;color:#1e40af;margin-bottom:12px}
.calc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.calc-item{background:#fff;border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border)}
.calc-item .val{font-size:20px;font-weight:700;color:var(--primary)}
.calc-item .lbl{font-size:11px;color:var(--text-light);margin-top:4px}
@media(max-width:640px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .card{padding:14px}
  .tab-content{padding:12px 8px}
  table{font-size:12px}
  th,td{padding:8px 6px}
  .login-card{padding:32px 20px}
  .layer-grid{grid-template-columns:1fr}
  .timeline-item{min-width:110px}
  .calc-grid{grid-template-columns:repeat(2,1fr)}
  .qv-chart-grid{grid-template-columns:1fr !important}
}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:28px 24px;width:85%;max-width:400px;text-align:center;max-height:80vh;overflow-y:auto}
.modal-box p{margin-bottom:20px;font-size:15px;color:#1e293b}
.modal-box .btns{display:flex;gap:12px;justify-content:center}
.hidden{display:none!important}
.station-quick-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;transition:all 0.2s;color:var(--text);white-space:nowrap}
.station-quick-btn:hover{background:#f0f7ff;border-color:var(--primary)}
.station-quick-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.gauge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;padding:8px 0}
.gauge-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 10px 10px;text-align:center;cursor:pointer;transition:all 0.25s;position:relative}
.gauge-card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,0.08);border-color:var(--primary)}
.gauge-card.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,0.2)}
.gauge-svg{width:100px;height:62px;margin:0 auto 6px}
.gauge-card .st-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.gauge-card .st-rate{font-size:18px;font-weight:700}
.gauge-card .st-status{font-size:10px;margin-top:4px}
.gauge-card .st-budget{font-size:10px;color:var(--text-light);margin-top:2px}
</style>
</head>

<div id="customModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">

<div id="loginPage" class="login-wrap">

<div id="mainPage" class="main-wrap">

    <div class="tab-panel" id="panel-data"></div>
    <div class="tab-panel" id="panel-settings"></div>
  </div>
</div>

      <button class="btn btn-danger" id="confirmOk">确定</button>
      <button class="btn btn-outline" onclick="hideModal()">取消</button>
    </div>
  </div>
</div>

// 各浆站年度预算（管理员可设置）
function getDefaultBudgets(){
  var b = {};
  STATIONS.forEach(function(s){
    // 优先使用飞书成本汇总表中的实际预算数据
    if(REAL_COST_DATA && REAL_COST_DATA[s.name] && REAL_COST_DATA[s.name].budget_annual > 0){
      b[s.name] = Math.round(REAL_COST_DATA[s.name].budget_annual);
    } else {
      var people = STAFF_COUNTS[s.name] || 10;
      var unitRate = getUnitRate(s.province);
      // 兜底：参考预算 = 人数 × 当地基数 × 单位费率 × 12个月 × 70%夯实率
      b[s.name] = Math.round(people * s.base * unitRate / 100 * 12 * 0.7);
    }
  });
  return b;
}

// ============ INIT ============
function init(){
  const savedRates = localStorage.getItem('ss7_rates');
  if(savedRates) rates = JSON.parse(savedRates);
  const savedLC = localStorage.getItem('ss7_layers');
  if(savedLC) layerConfigs = JSON.parse(savedLC);
  const savedAdj = localStorage.getItem('ss7_adjust');
  if(savedAdj) layerAdjustState = JSON.parse(savedAdj);
  const savedPolicy = localStorage.getItem('ss7_policy');
  if(savedPolicy) localPolicyUpdates = JSON.parse(savedPolicy);
  const savedBase = localStorage.getItem('ss7_baseHist');
  if(savedBase) baseAdjustHistory = JSON.parse(savedBase);
  STATIONS.forEach(s=>{
    if(!layerConfigs[s.name]) initLayerConfig(s.name);
  });
  const savedUser = localStorage.getItem('ss7_login') || localStorage.getItem('ss7_user');
  if(savedUser){
    const loginTime = localStorage.getItem('ss7_login_time');
    const sevenDays = 7 * 24 * 60 * 60 * 1000;
    if(loginTime && (Date.now() - parseInt(loginTime)) < sevenDays){
      // 7天内，自动登录
      currentUser = JSON.parse(savedUser);
      if(currentUser.role==='station_manager') layerCalcStation = currentUser.station;
      localStorage.setItem('ss7_login_time', Date.now().toString());
      showMain();
    } else {
      // 超过7天，清除登录状态，要求重新登录
      localStorage.removeItem('ss7_login');
      localStorage.removeItem('ss7_user');
      localStorage.removeItem('ss7_login_time');
    }
  }
}

function initLayerConfig(stationName){
  const st = STATIONS.find(s=>s.name===stationName);
  // 优先使用飞书实际数据
  if(DEFAULT_LAYER_DATA && DEFAULT_LAYER_DATA[stationName]){
    const d = DEFAULT_LAYER_DATA[stationName];
    layerConfigs[stationName] = {
      gm:   {count:d.gm.count,   base:d.gm.base==='default'?st.base:d.gm.base,   layerRate:100},
      mgmt: {count:d.mgmt.count, base:d.mgmt.base==='default'?st.base:d.mgmt.base, layerRate:100},
      mid:  {count:d.mid.count,  base:d.mid.base==='default'?st.base:d.mid.base,  layerRate:null},
      emp:  {count:d.emp.count,  base:d.emp.base==='default'?st.base:d.emp.base,  layerRate:null}
    };
    // 确保总人数为0的层级至少有0人（允许0人层级）
    if(layerConfigs[stationName].gm.count===0) layerConfigs[stationName].gm.base=st.base;
    if(layerConfigs[stationName].mgmt.count===0) layerConfigs[stationName].mgmt.base=st.base;
  } else {
    // 兜底：按比例分配
    const total = STAFF_COUNTS[stationName] || 10;
    const gmCount = Math.max(1, Math.round(total * 0.10));
    const mgmtCount = Math.max(1, Math.round(total * 0.15));
    const midCount = Math.max(1, Math.round(total * 0.25));
    const empCount = total - gmCount - mgmtCount - midCount;
    layerConfigs[stationName] = {
      gm: {count:gmCount, base:st.base, layerRate:100},
      mgmt: {count:mgmtCount, base:st.base, layerRate:100},
      mid: {count:midCount, base:st.base, layerRate:null},
      emp: {count:empCount>0?empCount:1, base:st.base, layerRate:null}
    };
  }
  recalcLayerRates(stationName);
}

function recalcLayerRates(stationName){
  const st = STATIONS.find(s=>s.name===stationName);
  if(!st || !layerConfigs[stationName]) return;
  const lc = layerConfigs[stationName];
  const total = lc.gm.count + lc.mgmt.count + lc.mid.count + lc.emp.count;
  if(total === 0) return;
  lc.gm.layerRate = 100;
  lc.mgmt.layerRate = lc.mgmt.count > 0 ? Math.min(100, +(st.actual * 1.15).toFixed(1)) : 0;
  lc.mid.layerRate = lc.mid.count > 0 ? Math.min(100, +(st.actual * 1.0).toFixed(1)) : 0;
  const gmContrib = lc.gm.count * 100;
  const mgmtContrib = lc.mgmt.count * lc.mgmt.layerRate;
  const midContrib = lc.mid.count * lc.mid.layerRate;
  const empContrib = st.actual * total - gmContrib - mgmtContrib - midContrib;
  lc.emp.layerRate = lc.emp.count > 0 ? Math.max(0, Math.min(100, +(empContrib / lc.emp.count).toFixed(1))) : 0;
}

// ============ LOGIN ============
function clearLoginForm(){
  document.getElementById('loginName').value = '';
  document.getElementById('loginPhone').value = '';
  var pwdEl = document.getElementById('loginPwd');
  pwdEl.value = '';
  pwdEl.type = 'text'; // 临时切text让浏览器丢弃自动填充
  setTimeout(function(){ pwdEl.type = 'password'; pwdEl.focus(); }, 50);
  document.getElementById('loginErr').textContent = '';
}

function doLogin(){
  try {
    var name = String(document.getElementById('loginName').value || '').trim();
    var phone = String(document.getElementById('loginPhone').value || '').trim();
    var pwd = String(document.getElementById('loginPwd').value || '');
    var errEl = document.getElementById('loginErr');
    errEl.textContent = '';

    if(!name || !phone || !pwd){
      errEl.textContent = '请输入姓名、手机号和密码';
      return;
    }

    // 查找用户 — 强制字符串比较
    var user = null;
    for(var i = 0; i < ROSTER.length; i++){
      if(String(ROSTER[i].name) === name && String(ROSTER[i].phone) === phone){
        user = ROSTER[i];
        break;
      }
    }
    if(!user){
      errEl.textContent = '姓名或手机号错误';
      return;
    }

    // 验证密码 — 强制字符串比较
    var passwords = getPasswords();
    var storedPwd = String(passwords[String(user.phone)] || '');
    if(storedPwd !== pwd){
      errEl.textContent = '密码错误，请重新输入';
      // 清空密码框，让用户重新输入
      document.getElementById('loginPwd').value = '';
      document.getElementById('loginPwd').focus();
      return;
    }

    // ===== 验证全部通过，执行登录 =====
    currentUser = { name: user.name, phone: user.phone, role: user.role, station: user.station || null };
    if(user.role === 'station_manager') layerCalcStation = user.station;
    localStorage.setItem('ss7_login', JSON.stringify(currentUser));
    localStorage.setItem('ss7_user', JSON.stringify(currentUser));
    localStorage.setItem('ss7_login_time', String(Date.now()));
    showMain();
  } catch(e){
    document.getElementById('loginErr').textContent = '系统异常，请清除浏览器缓存后重试';
  }
}

function doLogout(){
  localStorage.removeItem('ss7_user');
  localStorage.removeItem('ss7_login');
  localStorage.removeItem('ss7_login_time');
  currentUser = null;
  document.getElementById('mainPage').style.display='none';
  document.getElementById('loginPage').style.display='flex';
  document.getElementById('loginName').value='';
  document.getElementById('loginPhone').value='';
  document.getElementById('loginPwd').value='';
  document.getElementById('loginErr').textContent='';
}

function showMain(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('mainPage').style.display='block';
  const roleLabel = currentUser.role==='admin'?'管理员':(currentUser.role==='management'?'经营层':'');
  const stationLabel = currentUser.station ? `（${currentUser.station}浆站）` : `（${roleLabel}）`;
  document.getElementById('welcomeText').textContent = `欢迎，${currentUser.name}${stationLabel}`;
  renderTabs();
  renderAllPanels();
  const tabs = getTabs();
  if(tabs.length) switchTab(tabs[0].id);
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  const tabs = getTabs();
  bar.innerHTML = tabs.map((t,i)=>`<button class="tab-btn${i===0?' active':''}" data-id="${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}

function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const tab = getTabs().find(t=>t.id===id);
  if(tab){
    document.getElementById(tab.panel).classList.add('active');
    if(id==='overview') setTimeout(()=>renderOverview(),100);
    if(id==='company') setTimeout(()=>renderCompany(),100);
    if(id==='layer') renderLayerCalc();
    if(id==='case') renderCasePanel();
  }
}

function renderAllPanels(){
  if(currentUser.role==='admin') layerCalcStation = adminSelectedStation;
  renderOverview();
  if(currentUser.role==='station_manager'){
    renderLayerCalc();renderCompany();renderSuggest();renderPanelRate();renderCasePanel();renderSettings();
  } else if(currentUser.role==='admin'){
    renderLayerCalc();renderCompany();renderSuggest();renderPanelRate();renderCasePanel();renderPanelData();renderSettings();
  } else {

  }
}

// ============ HELPERS ============
function getUnitRate(province){const r=rates[province];if(!r)return 0;return +((r.pension_c+r.medical_c+r.unemp_c+r.injury_c).toFixed(1));}
function getPersonalRate(province){const r=rates[province];if(!r)return 0;return +((r.pension_p+r.medical_p+r.unemp_p+(r.injury_p||0)).toFixed(1));}
function calcMonthlyCost(base,province){return base*getUnitRate(province)/100;}
function fmt(n){return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function getStationInfo(name){return STATIONS.find(s=>s.name===name);}
function destroyChart(id){if(chartInstances[id]){chartInstances[id].destroy();delete chartInstances[id];}}
function getActiveStation(){
  if(currentUser.role==='station_manager')return currentUser.station;
  if(currentUser.role==='admin')return adminSelectedStation;
  return '商都';
}
function getStationSelectorHTML(currentStation,callback){
  let html=`<div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <label style="font-size:13px;color:var(--text-light);font-weight:600">查看浆站：</label>
    <select id="stationSelect" onchange="${callback}" style="width:auto;min-width:120px;padding:6px 10px;font-size:13px">`;
  STATIONS.forEach(s=>{html+=`<option value="${s.name}" ${s.name===currentStation?'selected':''}>${s.name}浆站</option>`;});
  html+=`</select></div>`;return html;
}

                c2.fillText(val + '%', bar.x, bar.y - 6);
                c2.restore();
              });
            });
          }
        }]
      });
    }
    
    // 2. 预算使用率环形图
    var ctx2 = document.getElementById('qvBudget');
    if(ctx2){
      var used = Math.min(cost, budget);
      var remaining = Math.max(0, budget - cost);
      var overBudget = cost > budget ? cost - budget : 0;
      var budgetUsageColor = usageRate > 100 ? '#ef4444' : (usageRate > 80 ? '#f59e0b' : '#10b981');
      
      var budgetLabels, budgetData, budgetColors;
      if(overBudget > 0){
        budgetLabels = ['已用(超支)', '预算剩余'];
        budgetData = [budget, overBudget];
        budgetColors = ['#f59e0b', '#e5e7eb'];
      } else {
        budgetLabels = ['已用', '剩余'];
        budgetData = [used, remaining];
        budgetColors = [budgetUsageColor, '#e5e7eb'];
      }
      
      chartInstances['qvBudget'] = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: budgetLabels,
          datasets: [{ data: budgetData, backgroundColor: budgetColors, borderWidth: 0 }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          cutout: '65%',
          plugins: {
            legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } },
            tooltip: { callbacks: { label: function(ctx){ return ctx.label + ': ¥' + ctx.raw.toLocaleString(); } } }
          }
        },
        plugins: [{
          id: 'centerText',
          afterDraw: function(chart){
            var c3 = chart.ctx;
            var w = chart.width;
            var ctop = chart.chartArea.top + (chart.chartArea.bottom - chart.chartArea.top) / 2;
            c3.save();
            c3.font = 'bold 18px sans-serif';
            c3.fillStyle = budgetUsageColor;
            c3.textAlign = 'center';
            c3.fillText(usageRate.toFixed(1) + '%', w / 2, ctop);
            c3.font = '11px sans-serif';
            c3.fillStyle = '#94a3b8';
            c3.fillText('使用率', w / 2, ctop + 18);
            c3.restore();
          }
        }]
      });
    }
  }, 100);
}

function adjustBase(stationName, newVal){
  const st = STATIONS.find(s=>s.name===stationName);
  if(st){
    const old = st.minBase;
    st.minBase = newVal;
    st.base = newVal;
    const record = {date:new Date().toISOString().slice(0,10),station:stationName,content:`${stationName}浆站最低基数从¥${old}调整为¥${newVal}`,type:'local'};
    baseAdjustHistory.push(record);
    saveBaseHist();
  }
}

function syncBasePolicy(){
  const record = {date:new Date().toISOString().slice(0,10),station:'全公司',content:'政策同步：已核对各浆站所在地最新最低社保基数（2026年8月），当前数据已为最新',type:'national'};
  baseAdjustHistory.push(record);
  saveBaseHist();
  const el = document.getElementById('syncResult');
  if(el){el.style.display='inline';setTimeout(()=>{el.style.display='none';},3000);}
}

// --- Sub-panel: Layer Overview ---
function renderLayerOverview(stName, st, lc){
  const unitRate = getUnitRate(st.province);
  const targetRate = 70;
  const totalCount = LAYER_DEFS.reduce((a,ld)=>a+lc[ld.key].count,0);
  const totalAtMin = LAYER_DEFS.reduce((a,ld)=>a+lc[ld.key].count*lc[ld.key].layerRate/100,0);
  const currentRate = totalCount>0?(totalAtMin/totalCount*100):0;

  const layersBelow = [];
  LAYER_DEFS.forEach(ld=>{
    const d = lc[ld.key];
    layersBelow.push({key:ld.key,label:ld.label,count:d.count,base:d.base,currentRate:d.layerRate,belowCount:d.count*(100-d.layerRate)/100,minBase:st.minBase});
  });

  const gap = Math.ceil((targetRate/100)*totalCount - totalAtMin);

  // 4 Scenarios
  let scenarioA = {name:'方案A：全员微调',desc:'所有人小幅调整，成本分摊最均匀',layers:[],costMonthly:0,achievable:true};
  let scenarioB = {name:'方案B：经营层',desc:'只调整经营层夯实率',layers:[],costMonthly:0};
  let scenarioC = {name:'方案C：中层+员工',desc:'调整中层级和员工级',layers:[],costMonthly:0,achievable:true};
  let scenarioD = {name:'方案D：只调员工级',desc:'成本最低，仅调整员工级',layers:[],costMonthly:0};

  if(gap > 0 && currentRate < targetRate){
    const lwr = layersBelow.filter(l=>l.currentRate<100&&l.count>0);
    const tr2 = lwr.reduce((a,l)=>a+l.belowCount,0);
    let rem = gap;
    lwr.forEach(l=>{
      const tm=tr2>0?Math.min(rem,l.belowCount*(gap/tr2)):0;
      scenarioA.layers.push({...l,targetRate:Math.min(100,+(l.currentRate+(tm/l.count*100)).toFixed(1)),peopleToMove:Math.ceil(tm)});
      rem-=tm;
    });
    scenarioA.costMonthly=scenarioA.layers.reduce((a,l)=>a+l.peopleToMove*(l.minBase*0.6)*unitRate/100,0);
    scenarioA.achievable=rem<=0.01;

    const md=layersBelow.find(l=>l.key==='mgmt');
    if(md){const tm=Math.min(gap,md.belowCount);scenarioB.layers.push({...md,targetRate:Math.min(100,+(md.currentRate+(tm/md.count*100)).toFixed(1)),peopleToMove:Math.ceil(tm)});scenarioB.costMonthly=Math.min(tm,md.belowCount)*(st.minBase*0.6)*unitRate/100;scenarioB.achievable=Math.min(tm,md.belowCount)>=gap;}else{scenarioB.achievable=false;}

    rem=gap;
    [layersBelow.find(l=>l.key==='emp'),layersBelow.find(l=>l.key==='mid')].filter(Boolean).forEach(l=>{
      const tm=Math.min(rem,l.belowCount);if(tm>0){scenarioC.layers.push({...l,targetRate:Math.min(100,+(l.currentRate+(tm/l.count*100)).toFixed(1)),peopleToMove:Math.ceil(tm)});rem-=tm;}
    });
    scenarioC.costMonthly=scenarioC.layers.reduce((a,l)=>a+l.peopleToMove*(l.minBase*0.6)*unitRate/100,0);
    scenarioC.achievable=rem<=0.01;

    const ed=layersBelow.find(l=>l.key==='emp');
    if(ed){const tm=Math.min(gap,ed.belowCount);scenarioD.layers.push({...ed,targetRate:Math.min(100,+(ed.currentRate+(tm/ed.count*100)).toFixed(1)),peopleToMove:Math.ceil(tm)});scenarioD.costMonthly=tm*(st.minBase*0.6)*unitRate/100;scenarioD.achievable=tm>=gap;}else{scenarioD.achievable=false;}
  }

  const scenarios=[scenarioA,scenarioB,scenarioC,scenarioD];
  const achievable=scenarios.filter(s=>s.achievable);
  let recommended=-1;
  if(achievable.length){const best=achievable.reduce((a,b)=>a.costMonthly<=b.costMonthly?a:b);recommended=scenarios.indexOf(best);}

  let html = `<div class="card">
    <h3>分层级调整测算 — ${stName}浆站（${st.city}，${totalCount}人）</h3>
    <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;font-size:13px">
      <span>省份：<b>${st.province}</b></span>
      <span>当前夯实率：<b style="color:${currentRate>=targetRate?'var(--success)':'var(--danger)'}">${currentRate.toFixed(1)}%</b></span>
      <span>目标要求：<b>${targetRate}%（2026年）</b></span>
      <span>单位费率：<b>${unitRate}%</b></span>
    </div>`;

  html += `<div class="tbl-wrap"><table>
    <thead><tr><th>层级</th><th>人数</th><th>基数</th><th>当前夯实率%</th><th>达标人数</th><th>未达标人数</th><th>月成本</th></tr></thead><tbody>`;
  LAYER_DEFS.forEach(ld=>{
    const d=lc[ld.key];
    if(d.count === 0){
      html+=`<tr style="color:var(--text-light)">
      <td><span class="tag ${ld.tagClass}">${ld.label}</span></td><td>0</td><td>-</td>
      <td>-</td><td>-</td><td>-</td><td>-</td></tr>`;
    } else {
      const atMin=+(d.count*d.layerRate/100).toFixed(1);const below=+(d.count-atMin).toFixed(1);const mc=calcMonthlyCost(d.base,st.province)*d.count;
      html+=`<tr class="${d.layerRate<100?'highlight-row':''}">
      <td><span class="tag ${ld.tagClass}">${ld.label}</span></td><td>${d.count}</td><td>¥${d.base}</td>
      <td style="color:${d.layerRate>=100?'var(--success)':'var(--warning)'};font-weight:600">${d.layerRate}%</td>
      <td style="color:var(--success)">${atMin}</td><td style="color:${below>0?'var(--danger)':'var(--success)'}">${below}</td>
      <td>¥${fmt(mc)}</td></tr>`;
    }
  });
  html+=`</tbody></table></div></div>`;

  if(currentRate < targetRate){
    html += `<div class="card"><h3>调整方案对比（4种方案）</h3>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:16px">需提升夯实率至 ${targetRate}%，还需 <b>${gap}</b> 人达到最低基数。</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">`;
    scenarios.forEach((sc,idx)=>{
      const isRec=idx===recommended;
      html+=`<div class="scenario-card ${isRec?'recommended':''}"><h4>${sc.name} ${isRec?'⭐ 推荐':''}</h4><div class="detail">${sc.desc}</div>
        <div style="margin:12px 0"><div class="cost">¥${fmt(sc.costMonthly)}<span style="font-size:12px;font-weight:400;color:var(--text-light)">/月</span></div>
        <div style="font-size:13px;color:var(--text-light)">年增成本：¥${fmt(sc.costMonthly*12)}</div></div><div class="detail">`;
      if(sc.layers.length){sc.layers.forEach(l=>{html+=`<div>${l.label}：${l.currentRate}% → ${l.targetRate}%（+${l.peopleToMove}人）</div>`;});}else{html+=`<div style="color:var(--text-light)">无需调整</div>`;}
      html+=`</div><div style="margin-top:8px;font-size:12px;color:${sc.achievable?'var(--success)':'var(--danger)'}">${sc.achievable?'✅ 可达标':'⚠️ 仅靠此方案不足以达标'}</div>
        <div style="margin-top:4px;font-size:11px;color:var(--text-light)">需调整：${sc.layers.reduce((a,l)=>a+l.peopleToMove,0)}人</div></div>`;
    });
    html+=`</div></div>`;
  } else {
    html+=`<div class="card" style="border-left:4px solid var(--success)"><h3 style="color:var(--success)">✅ 已达标</h3>
      <p style="font-size:13px;color:var(--text-light)">当前夯实率 ${currentRate.toFixed(1)}% 已超过 ${targetRate}% 要求，无需调整。</p></div>`;
  }

  // Custom adjustment
  html+=`<div class="card"><h3>自定义调整方案</h3>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:12px">手动输入各层级目标夯实率，计算成本（默认目标：2026年国家要求70%）</p>
    <div class="tbl-wrap"><table><thead><tr><th>层级</th><th>当前%</th><th>目标%</th><th>调整人数</th><th>月增成本</th></tr></thead><tbody>`;
  LAYER_DEFS.forEach(ld=>{
    const d=lc[ld.key];const sk=stName;
    if(!layerAdjustState[sk])layerAdjustState[sk]={};
    // 默认目标为70%（2026年国家要求），人数为0的层级显示为0
    if(!layerAdjustState[sk][ld.key])layerAdjustState[sk][ld.key]= d.count > 0 ? 70 : 0;
    const tL=layerAdjustState[sk][ld.key];const diff=tL-d.layerRate;
    const pm=diff>0?Math.ceil(d.count*diff/100):0;const ci=pm*(st.minBase*0.6)*unitRate/100;
    html+=`<tr><td><span class="tag ${ld.tagClass}">${ld.label}</span></td><td>${d.count>0?d.layerRate+'%':'-'}</td>
      <td><input type="number" value="${tL}" min="0" max="100" step="0.1" style="width:70px" onchange="updateCustomTarget('${stName}','${ld.key}',+this.value)"></td>
      <td style="color:${pm>0?'var(--danger)':'var(--success)'}">${d.count>0?(pm>0?'+':''+pm):'-'}</td>
      <td style="color:${ci>0?'var(--danger)':'var(--success)'}">${d.count>0?'¥'+fmt(ci):'-'}</td></tr>`;
  });
  let cm=0;
  LAYER_DEFS.forEach(ld=>{const d=lc[ld.key];const tL=(layerAdjustState[stName]&&layerAdjustState[stName][ld.key])||d.layerRate;const diff=tL-d.layerRate;const pm=diff>0?Math.ceil(d.count*diff/100):0;cm+=pm*(st.minBase*0.6)*unitRate/100;});
  html+=`<tr style="font-weight:700;background:#f0f7ff"><td colspan="3">合计月增成本</td>
    <td colspan="2" style="color:var(--primary);font-size:16px">¥${fmt(cm)}<span style="font-size:12px;font-weight:400"> / 年 ¥${fmt(cm*12)}</span></td></tr>`;
  html+=`</tbody></table></div>
    <div style="margin-top:16px"><canvas id="chartLayerCustom" height="250"></canvas></div>
  </div>`;
  return html;
}

// --- Sub-panel: Staff Config ---
function renderLayerStaffConfig(stName, st, lc){
  const unitRate = getUnitRate(st.province);

  let html = `<div class="card">

  const totalAtMin = LAYER_DEFS.reduce((a,ld)=>a+lc[ld.key].count*lc[ld.key].layerRate/100,0);

function calcOnePerson(stName, idx){
  calcMultiPerson(stName, idx);
}

function calcMultiPerson(stName, onlyIdx){
  const st = getStationInfo(stName);
  if(!st) return;
  const prov = st.province;
  const unitRate = getUnitRate(prov);
  const personalRate = getPersonalRate(prov);
  const r = rates[prov];
  const layerLabels = {gm:'总经理级',mgmt:'经营层',mid:'中层级',emp:'员工级'};
  const totalPeople = STAFF_COUNTS[stName] || 10;
  const showCount = Math.min(multiCalcVisibleCount, totalPeople);

  let totalIncUnitMonthly = 0, totalIncPersonalMonthly = 0;
  let totalCurUnitMonthly = 0, totalTgtUnitMonthly = 0;
  let rows = [];
  let atMinCount = 0;

  for(var i=0; i<showCount; i++){
    if(onlyIdx !== undefined && onlyIdx !== i) continue;
    var name = (document.getElementById('mp_name_'+i)||{}).value || ('员工'+(i+1));
    var layer = (document.getElementById('mp_layer_'+i)||{}).value || 'emp';
    var currentBase = +(document.getElementById('mp_base_'+i)||{}).value || 0;
    var actualWage = +(document.getElementById('mp_wage_'+i)||{}).value || 0;
    var targetRate = +(document.getElementById('mp_rate_'+i)||{}).value || 100;

    var targetBase = Math.max(currentBase, Math.min(actualWage, actualWage * targetRate / 100));
    var curUnit = currentBase * unitRate / 100;
    var tgtUnit = targetBase * unitRate / 100;
    var curPersonal = currentBase * personalRate / 100;
    var tgtPersonal = targetBase * personalRate / 100;
    var incUnit = tgtUnit - curUnit;
    var incPersonal = tgtPersonal - curPersonal;

    totalCurUnitMonthly += curUnit;
    totalTgtUnitMonthly += tgtUnit;
    totalIncUnitMonthly += incUnit;
    totalIncPersonalMonthly += incPersonal;
    if(targetBase >= st.minBase) atMinCount++;

    rows.push({idx:i, name, layer:layerLabels[layer], currentBase, targetBase, curUnit, tgtUnit, incUnit, incPersonal});
  }

  // 计算整体夯实率变化
  var curRateTotal = 0, tgtRateTotal = 0;
  for(var j=0;j<rows.length;j++){
    curRateTotal += rows[j].currentBase >= st.minBase ? 100 : (rows[j].currentBase / st.minBase * 100);
    tgtRateTotal += rows[j].targetBase >= st.minBase ? 100 : (rows[j].targetBase / st.minBase * 100);
  }
  var curImpliedRate = showCount > 0 ? (curRateTotal / showCount) : 0;
  var tgtImpliedRate = showCount > 0 ? (tgtRateTotal / showCount) : 0;

  let html = `<div class="single-calc-result">
    <h4>📊 多人批量测算结果 — ${stName}浆站（${rows.length}人）</h4>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:12px">
      ${prov.includes('自治区')?prov:prov+'省'} · ${st.city} | 单位费率：${unitRate}%
    </div>

    <div class="calc-grid" style="margin-bottom:16px">
      <div class="calc-item">
        <div class="val" style="color:${totalIncUnitMonthly>0?'var(--danger)':'var(--success)'}">¥${fmt(totalIncUnitMonthly)}</div>
        <div class="lbl">月增成本合计（单位）</div>
      </div>
      <div class="calc-item">
        <div class="val" style="color:${totalIncPersonalMonthly>0?'var(--danger)':'var(--success)'}">¥${fmt(totalIncPersonalMonthly)}</div>
        <div class="lbl">月增成本合计（个人）</div>
      </div>
      <div class="calc-item">
        <div class="val" style="color:var(--primary)">¥${fmt(totalIncUnitMonthly*12)}</div>
        <div class="lbl">年增成本合计（单位）</div>
      </div>
      <div class="calc-item">
        <div class="val" style="color:${curImpliedRate>=70?'var(--success)':'var(--danger)'}">
          ${curImpliedRate.toFixed(1)}% → ${tgtImpliedRate.toFixed(1)}%
        </div>
        <div class="lbl">夯实率变化（测算人数）</div>
      </div>
      <div class="calc-item">
        <div class="val" style="color:var(--success)">${atMinCount}/${rows.length}</div>
        <div class="lbl">调整后达标人数</div>
      </div>
    </div>

    <div class="tbl-wrap"><table>
      <thead><tr><th>编号</th><th>姓名</th><th>层级</th><th>当前基数</th><th>→</th><th>目标基数</th><th>月增(单位)</th><th>月增(个人)</th><th>年增(单位)</th></tr></thead><tbody>`;

  rows.forEach(function(row){
    html+=`<tr>
      <td>${row.idx+1}</td><td>${row.name}</td><td>${row.layer}</td>
      <td>¥${fmt(row.currentBase)}</td><td>→</td><td style="font-weight:600">¥${fmt(row.targetBase)}</td>
      <td style="color:${row.incUnit>0?'var(--danger)':'var(--success)'}">¥${fmt(row.incUnit)}</td>
      <td style="color:${row.incPersonal>0?'var(--danger)':'var(--success)'}">¥${fmt(row.incPersonal)}</td>
      <td style="color:var(--primary)">¥${fmt(row.incUnit*12)}</td>
    </tr>`;
  });

  html+=`<tr style="font-weight:700;background:#f0f7ff">
    <td colspan="6">合计</td>
    <td style="color:var(--danger)">¥${fmt(totalIncUnitMonthly)}</td>
    <td style="color:var(--danger)">¥${fmt(totalIncPersonalMonthly)}</td>
    <td style="color:var(--primary)">¥${fmt(totalIncUnitMonthly*12)}</td>
  </tr>`;
  html+=`</tbody></table></div>

    <div style="margin-top:14px;padding:12px;background:#fff;border-radius:8px;border:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">📈 夯实率影响分析</div>
      <div style="font-size:12px;color:var(--text-light);line-height:1.8">
        当前测算人数夯实率：<b>${curImpliedRate.toFixed(1)}%</b> → 调整后：<b style="color:${tgtImpliedRate>=70?'var(--success)':'var(--danger)'}">${tgtImpliedRate.toFixed(1)}%</b>
        （${tgtImpliedRate>=curImpliedRate?'提升':'下降'} ${Math.abs(tgtImpliedRate-curImpliedRate).toFixed(1)}%）<br>
        全站当前夯实率：<b>${st.actual}%</b> | 
        若按此方案调整全部${totalPeople}人，预估全站新夯实率：<b>${
          (()=>{
            var adjustExtra = (tgtImpliedRate - curImpliedRate) * showCount / 100;
            var newTotal = st.actual * totalPeople / 100 + adjustExtra;
            return (newTotal / totalPeople * 100).toFixed(1);
          })()
        }%</b>
      </div>
    </div>
  </div>`;

  document.getElementById('mp_result').innerHTML = html;
}

function getStationAnnualCost(s){
  // 计算某浆站的年度社保成本（单位部分）= 人数 × 基数 × 单位费率% × 12 × (夯实率/100)
  var people = STAFF_COUNTS[s.name] || 10;
  var unitRate = getUnitRate(s.province);
  return Math.round(people * s.base * unitRate / 100 * 12 * (s.actual / 100));
}
function renderCompany(){
  const panel=document.getElementById('panel-company');
  const isStation = currentUser.role==='station_manager';
  if(!canSeeAll() && !isStation){panel.innerHTML='';return;}

  const budgets = getBudgets();
  const isAdmin = currentUser.role==='admin';

  // 确定要显示的浆站列表
  let stationList;
  if(isStation){
    stationList = STATIONS.filter(s=>s.name===currentUser.station);
  } else {
    stationList = [...STATIONS];
  }

  // 计算各站成本和预算
  let totalCost = 0, totalBudget = 0, totalYtdActual = 0;
  const stationData = stationList.map(s=>{
    const cost = getStationAnnualCost(s);
    const budget = budgets[s.name] || 0;
    const usageRate = budget > 0 ? (cost / budget * 100) : 0;
    const ytdActual = (REAL_COST_DATA && REAL_COST_DATA[s.name]) ? REAL_COST_DATA[s.name].actual_ytd : 0;
    const ytdBudget = (REAL_COST_DATA && REAL_COST_DATA[s.name]) ? REAL_COST_DATA[s.name].budget_annual : 0;
    const execRate = ytdBudget > 0 ? (ytdActual / ytdBudget * 100) : 0;
    totalCost += cost;
    totalBudget += budget;
    totalYtdActual += ytdActual;
    return {station:s, cost, budget, usageRate, ytdActual, ytdBudget, execRate};
  });

  const totalUsageRate = totalBudget > 0 ? (totalCost / totalBudget * 100) : 0;
  const totalExecRate = totalBudget > 0 ? (totalYtdActual / totalBudget * 100) : 0;

  let html = '';

  // 总览区域
  html += `<div class="card"><h3>📊 成本 vs 预算 总览${isStation ? ' — '+currentUser.station+'浆站' : ' — 全公司'}</h3>
    <div class="stats-row">
      <div class="stat-card"><div class="num" style="color:var(--warning)">¥${fmt(totalYtdActual)}</div><div class="label">年度累计成本（1-7月实际）</div></div>
      <div class="stat-card"><div class="num" style="color:var(--primary)">¥${fmt(totalBudget)}</div><div class="label">年度预算总额</div></div>
      <div class="stat-card ${totalExecRate>58.3?'red':'green'}"><div class="num">${totalExecRate.toFixed(1)}%</div><div class="label">预算执行率</div></div>
    </div>
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
        <span>预算执行进度（时间进度58.3%）</span><span>${totalExecRate.toFixed(1)}%</span>
      </div>
      <div class="progress-bar" style="height:14px">
        <div class="fill" style="width:${Math.min(100,totalExecRate)}%;background:${totalExecRate>58.3?'var(--danger)':(totalExecRate>40?'var(--warning)':'var(--success)')}"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-top:4px">

    </div>
    <div style="margin-top:16px"><canvas id="chartCompanyOverview" height="100"></canvas></div>
  </div>`;

  // 管理员可编辑预算

    html += `<div class="card"><h3>⚙️ 预算设置</h3>
      <p style="font-size:13px;color:var(--text-light);margin-bottom:12px">可手动设置各浆站年度预算。修改后自动保存，成本vs预算看板实时更新。</p>
      <button class="btn btn-outline btn-sm" onclick="resetBudgets()">↩ 恢复默认预算</button>
      <div class="tbl-wrap" style="margin-top:12px"><table>
        <thead><tr><th>浆站</th><th>省份</th><th>在岗人数</th><th>年度累计成本</th><th>年度预算</th><th>执行率</th></tr></thead><tbody>`;
    STATIONS.forEach(s=>{
      const ytdActual = (REAL_COST_DATA && REAL_COST_DATA[s.name]) ? REAL_COST_DATA[s.name].actual_ytd : 0;
      const budget = budgets[s.name] || 0;
      const ytdBudget = (REAL_COST_DATA && REAL_COST_DATA[s.name]) ? REAL_COST_DATA[s.name].budget_annual : 0;
      const execRate = ytdBudget > 0 ? (ytdActual / ytdBudget * 100) : 0;
      html+=`<tr><td style="font-weight:600">${s.name}浆站</td><td>${s.province}</td><td>${STAFF_COUNTS[s.name]||'-'}</td>
        <td style="font-weight:600;color:var(--warning)">¥${fmt(ytdActual)}</td>

  });
  // 合计行
  const totalExecRateTbl = totalBudget > 0 ? (totalYtdActualTbl / totalBudget * 100) : 0;
  html+=`<tr style="font-weight:700;background:#f0f7ff">
    <td>合计</td><td></td><td>${stationList.reduce((a,s)=>a+(STAFF_COUNTS[s.name]||0),0)}</td><td></td>
    <td style="color:var(--warning)">¥${fmt(totalYtdActualTbl)}</td><td>¥${fmt(totalBudget)}</td>
    <td style="color:${totalExecRateTbl>58.3?'var(--danger)':'var(--success)'}">${totalExecRateTbl.toFixed(1)}%</td>
    <td style="color:${totalBudget-totalYtdActualTbl>=0?'var(--success)':'var(--danger)'}">¥${fmt(Math.abs(totalBudget-totalYtdActualTbl))}</td>
    <td></td></tr>`;
  html+=`</tbody></table></div>
    <div style="margin-top:16px"><canvas id="chartCompanyDetail" height="300"></canvas></div>
  </div>`;

  // 图示说明
  html += `<div class="card" style="background:#f8fafc">
    <h3>📖 看板说明</h3>
    <div style="font-size:13px;color:var(--text);line-height:1.8">
      <p><b>年度累计成本</b> = 1-7月实际发生的社会保险费（来源：7月成本汇总表）</p>
      <p><b>预算执行率</b> = 年度累计成本 ÷ 年度预算 × 100%。超过58.3%（7/12时间进度）表示超进度。</p>
      <p><b>差额</b> = 年度预算 - 年度累计成本。正数为预算剩余，负数为超支。</p>
      <p><b>参考预算</b>：默认取自飞书成本汇总表的年度计划成本。管理员可在上方"预算设置"中手动调整。</p>
    </div>
  </div>`;

  panel.innerHTML=html;

  // 图表：成本vs预算 对比柱状图
  setTimeout(()=>{
    destroyChart('companyOverview');
    const ctxO=document.getElementById('chartCompanyOverview');
    if(ctxO){
      chartInstances['companyOverview']=new Chart(ctxO,{type:'bar',
        data:{labels:['年度累计成本','年度预算'],
          datasets:[{data:[totalYtdActual,totalBudget],backgroundColor:['rgba(245,158,11,0.7)','rgba(16,185,129,0.7)'],borderWidth:0,borderRadius:6}]},
        options:{responsive:true,plugins:{legend:{display:false},
          tooltip:{callbacks:{label:function(c){return '¥'+fmt(c.raw)}}}},
          scales:{y:{beginAtZero:true,ticks:{callback:function(v){return '¥'+(v>=10000?(v/10000).toFixed(1)+'万':v)}}},x:{grid:{display:false}}}}
      });
    }
    destroyChart('companyDetail');
    const ctxD=document.getElementById('chartCompanyDetail');
    if(ctxD){
      const labels = stationData.map(d=>d.station.name);
      const ytdArr = stationData.map(d=>d.ytdActual);
      const budgetArr = stationData.map(d=>d.budget);
      const chartH2 = Math.max(200, stationData.length * 40);
      ctxD.parentElement.style.height = chartH2 + 'px';
      chartInstances['companyDetail']=new Chart(ctxD,{type:'bar',
        data:{labels,datasets:[
          {label:'年度累计成本',data:ytdArr,backgroundColor:'rgba(245,158,11,0.6)',borderRadius:3},
          {label:'年度预算',data:budgetArr,backgroundColor:'rgba(16,185,129,0.4)',borderRadius:3,borderColor:'rgba(16,185,129,0.8)',borderWidth:1}
        ]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:'top'},tooltip:{callbacks:{label:function(c){return c.dataset.label+': ¥'+fmt(c.raw)}}}},
          scales:{x:{beginAtZero:true,ticks:{callback:function(v){return v>=10000?(v/10000).toFixed(0)+'万':v}}},
            y:{ticks:{font:{size:11}},afterFit(axis){axis.width=80;}}}}
      });
    }
  },200);
}

// ============ PANEL: SUGGEST ============
function renderSuggest(){
  const panel=document.getElementById('panel-suggest');
  const isStation = currentUser.role==='station_manager';
  if(!canSeeAll() && !isStation){panel.innerHTML='';return;}
  const reqRate=70;
  const risks=STATIONS.map(s=>{const gap=reqRate-s.actual;let level;if(gap<=0)level='green';else if(gap<=5)level='yellow';else if(gap<=15)level='orange';else level='red';return{...s,gap,level};}).sort((a,b)=>b.gap-a.gap);
  // For station managers, only show their own station's data
  const myStationName = currentUser.station;
  const displayRisks = isStation ? risks.filter(r=>r.name===myStationName) : risks;
  const displayReds = displayRisks.filter(r=>r.level==='red');
  const displayOranges = displayRisks.filter(r=>r.level==='orange');
  const displayYellows = displayRisks.filter(r=>r.level==='yellow');
  const displayGreens = displayRisks.filter(r=>r.level==='green');

  // === Station manager optimization suggestions ===
  let html = '';
  if(isStation){
    const st = getStationInfo(myStationName);
    const actual = st.actual;
    const province = st.province;
    const unitRate = getUnitRate(province);
    const budgets = getBudgets();
    const budget = budgets[myStationName] || 0;
    const cost = getStationAnnualCost(st);

    html+=`<div class="card"><h3>📋 本站优化建议</h3>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px">
        <span class="policy-badge local">本站：${myStationName}浆站（${st.city}）</span>
        <span class="policy-badge local">所在省份：${province}</span>
        <span class="policy-badge ${actual>=70?'national':'diff'}">当前夯实率：${actual}%</span>
        <span class="policy-badge ${actual>=70?'national':'diff'}">单位费率合计：${unitRate.toFixed(1)}%</span>
      </div>
      <div style="font-size:14px;line-height:2;color:#374151">`;

    // Level-based suggestions
    if(actual < 70){
      const gapToTarget = (70 - actual).toFixed(2);
      html+=`<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:14px;margin-bottom:12px">
        <b style="color:#991b1b">⚠️ 夯实率不达标</b><br>
        当前夯实率 ${actual}% 低于2026年要求的70%，差距 <b>${gapToTarget}%</b>。
        建议尽快将缴费基数提升至当地最低标准（${st.minBase}元/月），避免合规风险。
        若持续不达标，可能面临社保稽核补缴及滞纳金风险。
      </div>`;
    } else if(actual < 70 + 5){
      html+=`<div style="background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:14px;margin-bottom:12px">
        <b style="color:#92400e">⚠️ 接近达标线</b><br>
        当前夯实率 ${actual}% 虽已达标，但距离70%仅有 ${(actual-70).toFixed(2)}% 的余量。
        建议微调基数即可稳固达标，例如将部分低基数岗位上调至最低标准以上。
      </div>`;
    } else if(actual < 80){
      html+=`<div style="background:#dbeafe;border:1px solid #93c5fd;border-radius:8px;padding:14px;margin-bottom:12px">
        <b style="color:#1e40af">🔵 已达标但仍有提升空间</b><br>
        当前夯实率 ${actual}% 已达标，但距离2027年80%要求仍有差距。
        建议提前规划提升方案，分阶段逐步提高基数，确保2027年前达到80%。
      </div>`;
    } else {
      html+=`<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:14px;margin-bottom:12px">
        <b style="color:#065f46">✅ 达标情况良好</b><br>
        当前夯实率 ${actual}% 表现优秀，已超过2027年80%的要求。可维持当前方案，
        继续关注2028年90%及长期100%的合规目标。
      </div>`;
    }

    // Layered adjustment suggestions based on province rates
    html+=`<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px">
      <b>📊 分层调整方向建议</b><br>
      <span style="font-size:13px;color:var(--text-light)">${province}单位费率合计 ${unitRate.toFixed(1)}%，`;
    if(unitRate >= 23){
      html+=`费率偏高，每提升1%夯实率带来的成本增幅较大。建议优先提升经营层和管理层的夯实率，
        以较少的人数覆盖较高的合规比例，控制总成本增长。</span></div>`;
    } else if(unitRate >= 21){
      html+=`费率处于中等水平。可考虑对全员进行适度微调，在成本可控范围内提升整体达标率。
        同时关注经营层夯实率，确保管理层合规。</span></div>`;
    } else {
      html+=`费率较低，提升基数的成本压力相对较小。建议积极提高全员夯实率，
        适当提高经营层和管理层基数可显著提升合规表现。</span></div>`;
    }

    // Cost vs budget status
    html+=`<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px">
      <b>💰 当前成本 vs 预算状态</b><br>
      <span style="font-size:13px">年度社保成本（单位部分）：<b>¥${fmt(cost)}</b>`;
    if(budget > 0){
      const usageRate = (cost / budget * 100).toFixed(1);
      const diff = cost - budget;
      if(diff <= 0){
        html+=` | 年度预算：<b>¥${fmt(budget)}</b> | <span style="color:var(--success);font-weight:600">✅ 预算充裕，结余 ¥${fmt(Math.abs(diff))}（使用率 ${usageRate}%）</span>`;
      } else {
        html+=` | 年度预算：<b>¥${fmt(budget)}</b> | <span style="color:var(--danger);font-weight:600">⚠️ 超出预算 ¥${fmt(diff)}（使用率 ${usageRate}%）</span>`;
      }
    } else {
      html+=` | 未设置预算`;
    }
    html+=`</span></div>`;

    // === 达标调整方案（按层级展示） ===
    {
      const totalPeople = STAFF_COUNTS[myStationName] || 0;
      const currentRate = st.actual;
      const minBase = st.minBase;
      const stationUnitRate = getUnitRate(province) / 100;

      let peopleNeedAdjust = 0;
      if(currentRate < 70 && totalPeople > 0){
        peopleNeedAdjust = Math.max(0, Math.ceil(totalPeople * (70 - currentRate) / 100));
      }

      // 获取层级人数
      var lc = layerConfigs[myStationName];
      if(!lc){
        var _total = STAFF_COUNTS[myStationName] || 10;
        var _gm = Math.max(1, Math.round(_total * 0.10));
        var _mgmt = Math.max(1, Math.round(_total * 0.15));
        var _mid = Math.max(1, Math.round(_total * 0.25));
        var _emp = _total - _gm - _mgmt - _mid;
        lc = {gm:{count:_gm},mgmt:{count:_mgmt},mid:{count:_mid},emp:{count:_emp>0?_emp:1}};
      }
      var layers = [
        {key:'emp',label:'员工级',count:lc.emp.count},
        {key:'mid',label:'中层级',count:lc.mid.count},
        {key:'mgmt',label:'经营层',count:lc.mgmt.count},
        {key:'gm',label:'总经理级',count:lc.gm.count}
      ];

      // 按成本从低到高分配需调整人数
      var remaining = peopleNeedAdjust;
      layers.forEach(function(la){ la.adjust = 0; });
      for(var li=0; li<layers.length && remaining>0; li++){
        var canAdj = Math.min(layers[li].count, remaining);
        layers[li].adjust = canAdj;
        remaining -= canAdj;
      }

      var curBase = st.base;
      var monthlyCost = 0;
      layers.forEach(function(la){
        la.monthInc = la.adjust * (minBase - curBase) * stationUnitRate;
        monthlyCost += la.monthInc;
      });
      var annualCost = monthlyCost * 12;

      if(peopleNeedAdjust <= 0){
        html+='<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:14px;margin-bottom:12px"><b style="color:#065f46">✅ 当前已达标，无需调整</b><br><span style="font-size:13px">本站夯实率已达到70%的2026年要求，建议维持当前方案。</span></div>';
      } else {
        html+='<div style="background:#e0f2fe;border:1px solid #7dd3fc;border-radius:8px;padding:14px;margin-bottom:12px">';
        html+='<b>🎯 达标调整方案</b>';
        html+='<div style="font-size:12px;color:var(--text-light);margin:6px 0 10px">调整策略：优先调整员工级基数至当地最低标准</div>';
        html+='<div class="tbl-wrap"><table style="font-size:13px">';
        html+='<thead><tr><th>层级</th><th>层级人数</th><th>需调整</th><th>当前基数</th><th>调至基数</th><th>月增成本</th><th>年增成本</th></tr></thead><tbody>';
        var totalAdjPeople = 0;
        layers.forEach(function(la){
          totalAdjPeople += la.adjust;
          var adjBaseStr = la.adjust > 0 ? '¥'+fmt(minBase) : '-';
          var monthStr = la.adjust > 0 ? '¥'+fmt(la.monthInc) : '-';
          var yearStr = la.adjust > 0 ? '¥'+fmt(la.monthInc*12) : '-';
          html+='<tr'+(la.adjust>0?' style="background:#fff7ed"':'')+'>';
          html+='<td style="font-weight:600">'+la.label+'</td>';
          html+='<td>'+la.count+'</td>';
          html+='<td style="font-weight:600;color:'+(la.adjust>0?'var(--danger)':'var(--text-light)')+'">'+la.adjust+'</td>';
          html+='<td>¥'+fmt(curBase)+'</td>';
          html+='<td>'+adjBaseStr+'</td>';
          html+='<td style="font-weight:600">'+monthStr+'</td>';
          html+='<td>'+yearStr+'</td>';
          html+='</tr>';
        });
        html+='<tr style="font-weight:700;background:#f0f7ff"><td>合计</td><td>'+totalPeople+'</td><td style="color:var(--danger)">'+totalAdjPeople+'</td><td></td><td></td><td style="color:var(--danger)">¥'+fmt(monthlyCost)+'</td><td style="color:var(--danger)">¥'+fmt(annualCost)+'</td></tr>';
        html+='</tbody></table></div>';
        html+='<div style="margin-top:10px;font-size:13px">调整后可达达标率：<b style="color:var(--success)">70% ✅</b></div>';
        html+='<div style="margin-top:6px;font-size:12px;color:var(--text-light)">💡 说明：将 '+totalAdjPeople+' 名员工的缴费基数从当前水平提升至当地最低基数 '+minBase+' 元，即可达到70%达标要求。</div>';
        html+='</div>';
      }
    }

    html+=`</div></div>`;
  }

  let html2=`<div class="card"><h3>风险分级总览</h3><div class="stats-row">
    <div class="stat-card red"><div class="num">${displayReds.length}</div><div class="label">高风险（差距>15%）</div></div>
    <div class="stat-card orange"><div class="num">${displayOranges.length}</div><div class="label">中风险（5-15%）</div></div>
    <div class="stat-card"><div class="num" style="color:#eab308">${displayYellows.length}</div><div class="label">低风险（<5%）</div></div>
    <div class="stat-card green"><div class="num">${displayGreens.length}</div><div class="label">已达标</div></div></div></div>`;

  function riskBlock(items,color,emoji,title){
    if(!items.length)return'';
    let h=`<div class="card" style="border-left:4px solid ${color}"><h3 style="color:${color}">${emoji} ${title}</h3>`;
    items.forEach(s=>{h+=`<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b>${s.name}浆站</b>（${s.province} · ${s.city}）<span>要求70% / 当前${s.actual}% / 差距 <b style="color:${color}">${s.gap.toFixed(2)}%</b></span></div></div>`;});
    return h+`</div>`;
  }
  html2+=riskBlock(displayReds,'#ef4444','🔴','高风险浆站（差距>15%）');
  html2+=riskBlock(displayOranges,'#f59e0b','🟠','中风险浆站（差距5-15%）');
  html2+=riskBlock(displayYellows,'#eab308','🟡','低风险浆站（差距<5%）');

  html2+=`<div class="card"><h3>达标路线图</h3><div class="tbl-wrap"><table>
    <thead><tr><th>浆站</th><th>所在县市</th><th>当前%</th><th>要求%</th><th>差距</th><th>优先级</th></tr></thead><tbody>`;
  displayRisks.filter(r=>r.level!=='green').forEach(s=>{
    const priority=s.gap>15?'🔴 紧急':(s.gap>5?'🟠 重要':'🟡 一般');
    html2+=`<tr><td style="font-weight:600">${s.name}浆站</td><td>${s.city}</td><td>${s.actual}%</td><td>${reqRate}%</td>
      <td style="color:var(--danger)">${s.gap.toFixed(2)}%</td><td>${priority}</td></tr>`;
  });
  html2+=`</tbody></table></div></div>`;

  // === 重点浆站提升方案（仅经营层/管理员可见） ===
  if(!isStation){
    const priorityStations = risks.filter(r => r.level === 'red' || r.level === 'orange').slice(0, 3);

    let priorityHtml = '<div class="card"><h3>🏢 重点浆站提升方案（Top '+priorityStations.length+'）</h3>';
    priorityHtml += '<p style="font-size:13px;color:var(--text-light);margin-bottom:14px">以下浆站夯实率缺口较大，建议优先关注并制定提升计划：</p>';

    if(priorityStations.length === 0){
      priorityHtml += '<div style="background:#d1fae5;border:1px solid #6ee7b7;border-radius:8px;padding:14px"><b style="color:#065f46">✅ 所有浆站均已达标或风险较低</b><br><span style="font-size:13px">当前无需重点关注的高风险浆站。</span></div>';
    }

    let totalPeopleAll = 0, totalCostMonthlyAll = 0, newlyCompliantCount = 0;

    // Helper: generate optimal multi-layer adjustment table for a station
    function buildLayerTable(sName, sInfo, peopleNeed){
      var lc = layerConfigs[sName];
      if(!lc){
        var _t = STAFF_COUNTS[sName] || 10;
        var _g = Math.max(1, Math.round(_t * 0.10));
        var _m = Math.max(1, Math.round(_t * 0.15));
        var _d = Math.max(1, Math.round(_t * 0.25));
        var _e = _t - _g - _m - _d;
        lc = {gm:{count:_g,base:sInfo.base},mgmt:{count:_m,base:sInfo.base},mid:{count:_d,base:sInfo.base},emp:{count:_e>0?_e:1,base:sInfo.base}};
      }
      var ur = getUnitRate(sInfo.province) / 100;
      var lays = [
        {key:'emp',label:'员工级',count:lc.emp.count,base:lc.emp.base},
        {key:'mid',label:'中层级',count:lc.mid.count,base:lc.mid.base},
        {key:'mgmt',label:'经营层',count:lc.mgmt.count,base:lc.mgmt.base},
        {key:'gm',label:'总经理级',count:lc.gm.count,base:lc.gm.base}
      ];
      // 计算每个层级调整1人至最低基数的月增成本，按成本从低到高排序
      lays.forEach(function(la){
        la.costPerPerson = la.count > 0 ? (sInfo.minBase - la.base) * ur : Infinity;
        la.adjust = 0;
      });
      // 成本最优分配：优先调整成本增量低的层级
      var rem = peopleNeed;
      var sortedLays = lays.filter(function(l){ return l.count > 0 && l.base < sInfo.minBase; })
                          .sort(function(a,b){ return a.costPerPerson - b.costPerPerson; });
      for(var i=0; i<sortedLays.length && rem>0; i++){
        var can = Math.min(sortedLays[i].count, rem);
        sortedLays[i].adjust = can;
        rem -= can;
      }
      // 如果还有剩余，说明低基层级人数不够，需要部分调整
      if(rem > 0){
        var allLays = lays.filter(function(l){ return l.count > 0; })
                          .sort(function(a,b){ return a.costPerPerson - b.costPerPerson; });
        for(var j=0; j<allLays.length && rem>0; j++){
          var extra = Math.min(allLays[j].count - allLays[j].adjust, rem);
          allLays[j].adjust += extra;
          rem -= extra;
        }
      }
      // 计算月增成本
      var mc = 0;
      lays.forEach(function(la){
        la.monthInc = la.adjust * (sInfo.minBase - la.base) * ur;
        mc += la.monthInc;
      });
      var totalAdj = 0;
      var tb = '<div class="tbl-wrap"><table style="font-size:12px;margin-top:8px">';
      tb += '<thead><tr><th>层级</th><th>人数</th><th>当前基数</th><th>需调整</th><th>调至基数</th><th>月增成本</th></tr></thead><tbody>';
      lays.forEach(function(la){
        totalAdj += la.adjust;
        var baseStr = la.adjust > 0 ? '¥'+fmt(la.base)+'→¥'+fmt(sInfo.minBase) : '¥'+fmt(la.base);
        var mStr = la.adjust > 0 ? '¥'+fmt(la.monthInc) : '-';
        tb += '<tr'+(la.adjust>0?' style="background:#fff7ed"':'')+'>';
        tb += '<td style="font-weight:600">'+la.label+'</td>';
        tb += '<td>'+la.count+'</td>';
        tb += '<td>¥'+fmt(la.base)+'</td>';
        tb += '<td style="font-weight:600;color:'+(la.adjust>0?'var(--danger)':'var(--text-light)')+'">'+la.adjust+'</td>';
        tb += '<td>'+baseStr+'</td>';
        tb += '<td style="font-weight:600">'+mStr+'</td>';
        tb += '</tr>';
      });
      tb += '<tr style="font-weight:700;background:#f0f7ff"><td>合计</td><td>'+(lays.reduce(function(a,l){return a+l.count},0))+'</td><td></td><td style="color:var(--danger)">'+totalAdj+'</td><td></td><td style="color:var(--danger)">¥'+fmt(mc)+'/月</td></tr>';
      tb += '</tbody></table></div>';
      tb += '<div style="margin-top:6px;font-size:11px;color:var(--text-light)">💡 优化策略：优先调整成本增量最低的层级，实现成本最优方案</div>';
      return {html: tb, monthlyCost: mc, totalAdj: totalAdj};
    }

    priorityStations.forEach(function(s){
      var tp = STAFF_COUNTS[s.name] || 0;
      var cr = s.actual;
      var pna = 0;
      if(cr < 70 && tp > 0){
        pna = Math.max(0, Math.ceil(tp * (70 - cr) / 100));
      }
      var ur = getUnitRate(s.province) / 100;
      var mcm = pna * (s.minBase - s.base) * ur;

      totalPeopleAll += pna;
      totalCostMonthlyAll += mcm;
      if(s.actual < 70 && pna > 0) newlyCompliantCount++;

      var badgeClass = s.level==='red' ? 'badge-err' : 'badge-warn';
      var badgeText = s.level==='red' ? '高风险' : '中风险';

      priorityHtml += '<div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px">';
      priorityHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
      priorityHtml += '<b style="font-size:15px">'+s.name+'浆站</b>';
      priorityHtml += '<span class="badge '+badgeClass+'">'+badgeText+'</span></div>';
      priorityHtml += '<div style="font-size:13px;color:var(--text-light);margin-bottom:10px">'+s.province+' · '+s.city+' | 当前夯实率 <b style="color:var(--danger)">'+s.actual+'%</b> | 目标70% | 差距 <b>'+s.gap.toFixed(2)+'%</b></div>';

      if(pna > 0){
        var layerResult = buildLayerTable(s.name, s, pna);
        priorityHtml += '<div style="font-size:13px;font-weight:600;margin-bottom:4px">调整方案：</div>';
        priorityHtml += layerResult.html;
        priorityHtml += '<div style="margin-top:8px;font-size:13px">调整后达标率：<b style="color:var(--success)">70% ✅</b></div>';
      } else {
        priorityHtml += '<div style="font-size:13px;color:var(--success)">✅ 已达标，无需调整</div>';
      }
      priorityHtml += '</div>';
    });

    // Summary block
    if(priorityStations.length > 0){
      priorityHtml += '<div style="background:#e0f2fe;border:1px solid #7dd3fc;border-radius:8px;padding:14px;margin-top:16px">';
      priorityHtml += '<b>📊 汇总（以上 '+priorityStations.length+' 个浆站）</b>';
      priorityHtml += '<div style="margin-top:10px;font-size:13px">';
      priorityHtml += '需调整总人数：<b>'+totalPeopleAll+' 人</b><br>';
      priorityHtml += '每月总增加成本：<b style="color:var(--danger)">¥'+fmt(totalCostMonthlyAll)+'</b><br>';
      priorityHtml += '每年总增加成本：<b style="color:var(--danger)">¥'+fmt(totalCostMonthlyAll*12)+'</b><br>';
      priorityHtml += '全部调整后可新增达标浆站：<b style="color:var(--success)">'+newlyCompliantCount+' 个</b>';
      priorityHtml += '</div></div>';
    }

    priorityHtml += '</div>';
    html += priorityHtml;
  }

  html+=html2;
  panel.innerHTML=html;
}

function renderPanelRate(){

      <td><input type="number" value="${r.pension_p}" style="width:56px" onchange="editRate('${prov}','pension_p',+this.value)"></td>
      <td><input type="number" value="${r.medical_c}" style="width:56px" onchange="editRate('${prov}','medical_c',+this.value)"></td>
      <td><input type="number" value="${r.medical_p}" style="width:56px" onchange="editRate('${prov}','medical_p',+this.value)"></td>
      <td><input type="number" value="${r.unemp_c}" style="width:56px" onchange="editRate('${prov}','unemp_c',+this.value)"></td>
      <td><input type="number" value="${r.unemp_p}" style="width:56px" onchange="editRate('${prov}','unemp_p',+this.value)"></td>

  }
  html+=`</tbody></table></div></div>`;

  html+=`<div class="card"><h3>省级费率汇总对比</h3><div class="tbl-wrap"><table>
    <thead><tr><th>省份</th><th>养老(单位)</th><th>医疗(单位)</th><th>失业(单位)</th><th>工伤(单位)</th><th>生育(单位)</th><th>合计(单位)</th><th>个人合计</th></tr></thead><tbody>`;
  for(const[prov,r]of Object.entries(rates)){
    const tc=r.pension_c+r.medical_c+r.unemp_c+r.injury_c;const tp=r.pension_p+r.medical_p+r.unemp_p+(r.injury_p||0);
    var fmtRate=function(v){return Number(v).toFixed(1);};
    const injMax=prov==='广东'?'1.4%':'1.9%';const medR=prov==='浙江'?'8.5%-9.5%':Number(r.medical_c).toFixed(1)+'%';
    const tcMin=r.pension_c+r.medical_c+r.unemp_c+0.2;const tcMax=r.pension_c+(prov==='浙江'?9.5:r.medical_c)+r.unemp_c+1.9;
    html+=`<tr><td style="font-weight:600">${prov}</td><td>${fmtRate(r.pension_c)}%</td><td>${medR}</td><td>${fmtRate(r.unemp_c)}%</td><td>0.2%-${injMax}</td><td>0%</td>
      <td style="font-weight:700;color:var(--primary)">${tcMin.toFixed(1)}%-${tcMax.toFixed(1)}%</td><td style="font-weight:700;color:var(--text-light)">${tp.toFixed(1)}%</td></tr>`;
  }
  html+=`</tbody></table></div></div>`;
  // 最低社保基数表（从首页移过来）
  html += renderMinBaseSection();
  panel.innerHTML=html;
}

    <div class="std-card">
      <h4>2. 经济补偿金</h4>
      <p>劳动者以"未依法缴纳社会保险费"为由解除劳动合同的（《劳动合同法》第38条），用人单位需支付经济补偿金：<br>
      <b>计算公式：工作年限 × 离职前12个月平均工资</b><br>

        <p style="margin-bottom:8px"><b>含义：</b>单位未足额缴纳社保费时，社保行政部门责令限期补缴欠缴部分，并按日加收滞纳金。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>按最低基数而非实际工资缴社保、少报参保人数、漏缴险种等。</p>

        <p style="margin-bottom:8px"><b>适用情形：</b>员工因单位未缴/未足额缴社保而主动提出离职（《劳动合同法》第38条），无需提前30天通知即可立即解除。</p>
        <p><b>计算方式：</b>补偿金 = 工作年限 × 离职前12个月平均工资。每满1年付1个月；6个月以上不满1年按1年算；不满6个月付半个月。<br>

      <div class="std-card" style="border-left-color:#3b82f6">
        <h4 style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#dbeafe;color:#1e40af">3</span> 一次性伤残补助金</h4>
        <p style="margin-bottom:8px"><b>含义：</b>职工因工致残被鉴定为1~10级伤残后，由工伤保险基金一次性支付的伤残补助。若单位未按实际工资缴工伤保险，差额由单位补足。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>工伤发生后经劳动能力鉴定构成伤残等级。常见于浆站驾驶、设备操作等岗位。</p>
        <p><b>计算方式：</b>补助金 = 本人工资 × 月数（1级27个月、2级25个月…10级7个月）。"本人工资"指工伤前12个月平均月缴费工资；若缴费基数低于实际工资，差额由用人单位补足。<br>
        <span style="color:var(--text-light);font-size:12px">依据：《工伤保险条例》第35~37条、第62条</span></p>
      </div>

      <div class="std-card" style="border-left-color:#3b82f6">
        <h4 style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#dbeafe;color:#1e40af">4</span> 一次性工伤医疗补助金 + 就业补助金</h4>
        <p style="margin-bottom:8px"><b>含义：</b>5~10级伤残职工与单位解除或终止劳动关系时，由工伤保险基金支付一次性工伤医疗补助金，由用人单位支付一次性伤残就业补助金。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>伤残职工离职时触发。各省标准不同，一般按解除时上年度社平工资×若干月计算。</p>
        <p><b>计算方式：</b>医疗补助金 + 就业补助金，具体月数由省级规定（如安徽5~6级医疗补助金分别为20、18个月；就业补助金分别为20、18个月）。若单位未缴工伤保险，全部费用由单位承担。<br>
        <span style="color:var(--text-light);font-size:12px">依据：《工伤保险条例》第36~37条；各省工伤保险实施办法</span></p>
      </div>

      <div class="std-card" style="border-left-color:#3b82f6">
        <h4 style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#dbeafe;color:#1e40af">5</span> 停工留薪期工资</h4>
        <p style="margin-bottom:8px"><b>含义：</b>职工因工伤暂停工作接受治疗期间，原工资福利待遇不变，由所在单位按月支付。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>工伤职工需要暂停工作接受治疗的，一般不超过12个月；伤情严重经批准可延长，但最长不超过24个月。</p>
        <p><b>计算方式：</b>停工留薪期工资 = 受伤前12个月平均工资 × 停工月数。期间单位还需继续缴纳社保。若单位拒绝支付，职工可申请仲裁。<br>
        <span style="color:var(--text-light);font-size:12px">依据：《工伤保险条例》第33条</span></p>
      </div>

      <div class="std-card" style="border-left-color:#8b5cf6">
        <h4 style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#ede9fe;color:#5b21b6">6</span> 医保差额损失赔偿</h4>
        <p style="margin-bottom:8px"><b>含义：</b>因单位未足额缴纳医疗保险，导致员工医保个人账户划入金额减少、住院报销比例降低的，差额部分由单位全额赔偿。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>员工生病住院后发现医保报销金额低于应得数额，个人账户到账金额偏少。常见于长期按最低基数缴医保的单位。</p>
        <p><b>计算方式：</b>赔偿金额 = 应报销金额 − 实际报销金额（含门诊差额、住院差额、个人账户差额等）。需提供医疗费用票据及医保结算单。<br>
        <span style="color:var(--text-light);font-size:12px">依据：《社会保险法》第23条、第86条；《民法典》第1165条</span></p>
      </div>

      <div class="std-card" style="border-left-color:#8b5cf6">
        <h4 style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#ede9fe;color:#5b21b6">7</span> 养老金待遇损失赔偿</h4>
        <p style="margin-bottom:8px"><b>含义：</b>因单位未足额缴纳养老保险，导致员工退休后养老金水平降低的，员工可要求单位一次性赔偿养老金差额损失。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>已退休或即将退休的员工发现养老金偏低，追溯发现单位在职期间未按实际工资缴养老保险。</p>
        <p><b>计算方式：</b>一次性赔偿 = 月养老金差额 × 预期领取月数（一般按12~20年计算）。安徽地区可按 ∑少报缴费基数×8%×15 计算。也可要求单位补缴以恢复待遇。<br>
        <span style="color:var(--text-light);font-size:12px">依据：最高法劳动争议司法解释；《社会保险法》第12条</span></p>
      </div>

      <div class="std-card" style="border-left-color:#6b7280">
        <h4 style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:#f3f4f6;color:#374151">8</span> 行政罚款（拒不补缴时）</h4>
        <p style="margin-bottom:8px"><b>含义：</b>用人单位经社保行政部门责令限期补缴后仍不缴纳的，由行政部门处以罚款。</p>
        <p style="margin-bottom:8px"><b>适用情形：</b>单位在收到补缴通知后逾期仍不补缴，或恶意逃避缴费义务。</p>
        <p><b>计算方式：</b>罚款 = 欠缴社会保险费数额 × 1~3倍。同时可对直接负责的主管人员和其他直接责任人员处以500~3000元罚款。<br>
        <span style="color:var(--text-light);font-size:12px">依据：《社会保险法》第86条</span></p>
      </div>

    </div>

    <div class="tbl-wrap" style="margin-top:20px"><table>
      <thead><tr><th>赔付项目</th><th>含义简述</th><th>适用情形</th><th>计算标准</th><th>法律依据</th></tr></thead><tbody>
      <tr><td style="font-weight:600">补缴社保差额+滞纳金</td><td style="font-size:12px;text-align:left">限期补缴欠缴部分，按日加收滞纳金</td><td style="font-size:12px;text-align:left">按最低基数缴纳、少报人数、漏缴险种</td><td>欠缴额×0.05%/天</td><td>《社保法》第86条</td></tr>
      <tr><td style="font-weight:600">经济补偿金</td><td style="font-size:12px;text-align:left">员工因单位未缴社保被迫离职时支付</td><td style="font-size:12px;text-align:left">员工依据第38条解除合同</td><td>工作年限×月均工资</td><td>《劳动合同法》第38/46/47条</td></tr>
      <tr><td style="font-weight:600">一次性伤残补助金</td><td style="font-size:12px;text-align:left">因工致残1~10级的一次性补助</td><td style="font-size:12px;text-align:left">工伤后经劳动能力鉴定构成伤残</td><td>本人工资×7~27个月</td><td>《工伤保险条例》第35~37条</td></tr>
      <tr><td style="font-weight:600">医疗补助金+就业补助金</td><td style="font-size:12px;text-align:left">5~10级伤残职工离职时支付</td><td style="font-size:12px;text-align:left">伤残职工与单位解除/终止劳动关系</td><td>各省规定（社平工资×月数）</td><td>《工伤保险条例》第36~37条</td></tr>
      <tr><td style="font-weight:600">停工留薪期工资</td><td style="font-size:12px;text-align:left">工伤治疗期间原工资福利待遇不变</td><td style="font-size:12px;text-align:left">工伤职工暂停工作接受治疗（≤12月）</td><td>受伤前平均工资×停工月数</td><td>《工伤保险条例》第33条</td></tr>
      <tr><td style="font-weight:600">医保差额损失赔偿</td><td style="font-size:12px;text-align:left">未足额缴医保致待遇降低的差额赔偿</td><td style="font-size:12px;text-align:left">员工报销金额低于应得数额</td><td>应报销额−实际报销额</td><td>《社保法》第23/86条</td></tr>
      <tr><td style="font-weight:600">养老金损失赔偿</td><td style="font-size:12px;text-align:left">未足额缴养老险致退休金降低的赔偿</td><td style="font-size:12px;text-align:left">退休员工追溯在职期间缴费基数不足</td><td>月差额×预期领取月数</td><td>最高法司法解释</td></tr>
      <tr><td style="font-weight:600">行政罚款</td><td style="font-size:12px;text-align:left">逾期不补缴时的行政处罚</td><td style="font-size:12px;text-align:left">责令补缴后仍拒不缴纳</td><td>欠缴数额1~3倍</td><td>《社保法》第86条</td></tr>
    </tbody></table></div>
  </div>`;

  panel.innerHTML = html;
}

// ============ PANEL: DATA ============
function renderPanelData(){
  const panel=document.getElementById('panel-data');
  if(currentUser.role!=='admin'){panel.innerHTML='';return;}
  panel.innerHTML=`
  <div class="card"><h3>数据管理</h3>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:16px">清除或重置当前数据</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button class="btn btn-danger" onclick="confirmClear()">🗑 一键清除所有数据</button>
      <button class="btn btn-outline" onclick="resetRates()">↩ 恢复默认费率</button>
      <button class="btn btn-outline" onclick="resetAllLayers()">↩ 恢复默认层级配置</button>
    </div></div>
  <div class="card"><h3>数据统计</h3>
    <div style="font-size:13px;color:var(--text-light)">
      <p>• 层级配置：${Object.keys(layerConfigs).length} 个浆站</p>
      <p>• 总在岗人数：${Object.values(STAFF_COUNTS).reduce((a,b)=>a+b,0)} 人</p>
      <p>• 费率自定义：${JSON.stringify(rates)!==JSON.stringify(DEFAULT_RATES)?'已修改':'默认'}</p>
      <p>• 达标站数（70%要求）：${STATIONS.filter(s=>s.actual>=70).length} / ${STATIONS.length}</p>
      <p>• 不达标站数：${STATIONS.filter(s=>s.actual<70).length}</p>
      <p>• 本地政策更新：${localPolicyUpdates.length} 条</p>
      <p>• 基数调整记录：${baseAdjustHistory.length} 条</p>
    </div></div>`;
}

function confirmClear(){
  document.getElementById('confirmModal').classList.add('show');
  document.getElementById('confirmMsg').textContent='确定要清除所有测算数据吗？';
  document.getElementById('confirmOk').onclick=()=>{
    layerAdjustState={};localPolicyUpdates=[];baseAdjustHistory=[];
    localStorage.removeItem('ss7_adjust');localStorage.removeItem('ss7_policy');localStorage.removeItem('ss7_baseHist');
    hideModal();renderAllPanels();
  };
}
function hideModal(){document.getElementById('confirmModal').classList.remove('show');}
function resetRates(){rates=JSON.parse(JSON.stringify(DEFAULT_RATES));saveRates();renderPanelRate();}
function resetAllLayers(){STATIONS.forEach(s=>initLayerConfig(s.name));saveLayers();renderOverview();}


// ============ PANEL: SETTINGS (Password Management) ============
function renderSettings(){
  const panel = document.getElementById('panel-settings');
  if(!panel) return;
  let html = '';
  if(currentUser.role === 'admin'){
    html += '<div class="card"><h3>\u{1F510} 用户密码管理</h3>'
      + '<p style="font-size:13px;color:var(--text-light);margin-bottom:16px">管理员可重置任意用户的密码。重置后该用户需使用新密码登录。</p>'
      + '<div class="tbl-wrap"><table><thead><tr><th>姓名</th><th>手机号</th><th>角色</th><th>所属浆站</th><th>操作</th></tr></thead><tbody>';
    ROSTER.forEach(function(u){
      var rl = u.role==='admin'?'管理员':(u.role==='management'?'经营层':'站长');
      var sl = u.station ? u.station+'浆站' : '-';
      var isSelf = u.phone === currentUser.phone;
      html += '<tr'+(isSelf?' style="background:#f0f7ff"':'')+'>'
        + '<td style="font-weight:600">'+u.name+(isSelf?' (我)':'')+'</td>'
        + '<td>'+u.phone+'</td><td>'+rl+'</td><td>'+sl+'</td>'
        + '<td><button class="btn btn-outline btn-sm" onclick="adminResetPwd(\x27'+u.phone+'\x27,\x27'+u.name+'\x27)">重置密码</button></td></tr>';
    });
    html += '</tbody></table></div></div>';
    html += '<div class="card"><h3>\u{1F511} 修改我的密码</h3>'
      + '<div style="max-width:400px">'
      + '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-light);display:block;margin-bottom:4px">旧密码</label>'
      + '<input type="password" id="myOldPwd" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px"></div>'
      + '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-light);display:block;margin-bottom:4px">新密码</label>'
      + '<input type="password" id="myNewPwd" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px"></div>'
      + '<div style="margin-bottom:16px"><label style="font-size:13px;color:var(--text-light);display:block;margin-bottom:4px">确认新密码</label>'
      + '<input type="password" id="myNewPwd2" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px"></div>'
      + '<button class="btn btn-primary" onclick="changeMyPwd()">修改密码</button>'
      + '<div id="myPwdMsg" style="margin-top:10px;font-size:13px;min-height:20px"></div></div></div>';
  } else {
    var stationLabel = currentUser.station ? currentUser.station+'浆站' : '';
    html += '<div class="card"><h3>\u{1F511} 修改密码'+(stationLabel?' — '+stationLabel:'')+'</h3>'
      + '<div style="max-width:400px">'
      + '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-light);display:block;margin-bottom:4px">旧密码</label>'
      + '<input type="password" id="myOldPwd" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px"></div>'
      + '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-light);display:block;margin-bottom:4px">新密码</label>'
      + '<input type="password" id="myNewPwd" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px"></div>'
      + '<div style="margin-bottom:16px"><label style="font-size:13px;color:var(--text-light);display:block;margin-bottom:4px">确认新密码</label>'
      + '<input type="password" id="myNewPwd2" style="width:100%;padding:10px;border:1px solid #d1d5db;border-radius:6px;font-size:14px"></div>'
      + '<button class="btn btn-primary" onclick="changeMyPwd()">修改密码</button>'
      + '<div id="myPwdMsg" style="margin-top:10px;font-size:13px;min-height:20px"></div></div></div>';
  }
  panel.innerHTML = html;
}

function changeMyPwd(){
  var oldPwd = document.getElementById('myOldPwd').value;
  var newPwd = document.getElementById('myNewPwd').value;
  var newPwd2 = document.getElementById('myNewPwd2').value;
  var msg = document.getElementById('myPwdMsg');
  if(!oldPwd || !newPwd || !newPwd2){ msg.innerHTML='<span style="color:var(--danger)">请填写所有字段</span>'; return; }
  if(newPwd !== newPwd2){ msg.innerHTML='<span style="color:var(--danger)">两次输入的新密码不一致</span>'; return; }
  if(newPwd.length < 4){ msg.innerHTML='<span style="color:var(--danger)">密码长度至少4位</span>'; return; }
  var passwords = getPasswords();
  if(passwords[currentUser.phone] !== oldPwd){ msg.innerHTML='<span style="color:var(--danger)">旧密码错误</span>'; return; }
  passwords[currentUser.phone] = newPwd;
  savePasswords(passwords);
  // 清除登录态，要求用新密码重新登录
  localStorage.removeItem('ss7_login');
  localStorage.removeItem('ss7_user');
  localStorage.removeItem('ss7_login_time');
  currentUser = null;
  // 跳转到登录页，提示使用新密码
  document.getElementById('mainPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginName').value = '';
  document.getElementById('loginPhone').value = '';
  document.getElementById('loginPwd').value = '';
  document.getElementById('loginErr').innerHTML = '<span style="color:var(--success)">✅ 密码修改成功，请用新密码重新登录</span>';
}

function adminResetPwd(phone, name){
  document.getElementById('confirmModal').classList.add('show');
  document.getElementById('confirmMsg').textContent = '确定要将 '+name+' 的密码重置为默认密码 123456 吗？';
  document.getElementById('confirmOk').onclick = function(){
    var passwords = getPasswords();
    passwords[phone] = DEFAULT_PASSWORD;
    savePasswords(passwords);
    hideModal();
    renderSettings();
    alert(name + ' 的密码已重置为 123456');
  };
}

// ============ START ============
init();
</script>
